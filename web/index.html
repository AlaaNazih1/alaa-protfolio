<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="alaa_protfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>alaa_protfolio</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #portfolio-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #191C1D;
      color: #D9D7D2;
      font-family: Arial, sans-serif;
      opacity: 1;
      visibility: visible;
      transition: opacity 350ms ease, visibility 350ms ease;
    }
  
    #portfolio-splash.splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
  
    .splash-avatar {
      width: 104px;
      height: 104px;
      object-fit: cover;
      object-position: center 20%;
      border-radius: 50%;
      border: 3px solid #38A8FF;
      box-shadow: 0 0 35px rgba(56, 168, 255, 0.18);
      margin-bottom: 22px;
    }
  
    .splash-name {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 9px;
      letter-spacing: 0.3px;
    }
  
    .splash-role {
      color: #38A8FF;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }
  
    .splash-loader {
      width: 170px;
      height: 4px;
      border-radius: 20px;
      overflow: hidden;
      background: #35393A;
    }
  
    .splash-loader::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: #1551C7;
      animation: splash-loading 1.2s ease-in-out infinite;
    }
  
    @keyframes splash-loading {
      from {
        transform: translateX(-110%);
      }
  
      to {
        transform: translateX(360%);
      }
    }
  
    @media (prefers-reduced-motion: reduce) {
      .splash-loader::after {
        animation: none;
        width: 100%;
      }
  
      #portfolio-splash {
        transition: none;
      }
    }
  </style>

</head>
<body>
  <div id="portfolio-splash" role="status" aria-label="Loading portfolio">
    <div class="splash-content">
      <img class="splash-avatar" src="assets/assets/images/alaa_prtoflio.png" alt="Alaa Nazih" />
  
      <h1 class="splash-name">Alaa Nazih</h1>
  
      <div class="splash-role">FLUTTER DEVELOPER</div>
  
      <div class="splash-loader"></div>
    </div>
  </div>
  
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('portfolio-splash');

      if (splash) {
        splash.classList.add('splash-hidden');

        setTimeout(function () {
          splash.remove();
        }, 400);
      }
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
